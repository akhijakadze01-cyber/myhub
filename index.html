<!DOCTYPE html>
<html lang="ka" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>პერსონალური სამუშაო სივრცე</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .light .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Header -->
  <header class="bg-slate-800/90 border-b border-slate-700/80 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-20 backdrop-blur shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-xl shadow-md">
        <i class="fa-solid fa-compass-drafting"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">პერსონალური სამუშაო სივრცე</h1>
        <p class="text-xs text-slate-400" id="currentDateStr"></p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <button id="notifyBtn" onclick="toggleNotificationAccess()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-900/40 text-amber-200 border border-amber-700/50 hover:bg-amber-800/40 transition flex items-center gap-1.5">
        <i class="fa-regular fa-bell"></i> <span id="notifyBtnText">ხმა / შეხსენება</span>
      </button>
      <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-lg border border-slate-700 bg-slate-800 flex items-center justify-center text-slate-300 hover:bg-slate-700 transition" title="განათების შეცვლა">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- მარცხენა სვეტი: Quick Task & სია (5 სვეტი) -->
    <div class="lg:col-span-5 space-y-6">
      
      <!-- Quick Task Entry -->
      <div class="bg-slate-800/80 rounded-2xl p-5 shadow-sm border border-slate-700/80">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-bolt text-amber-400"></i> სწრაფი დავალება (QUICK TASK)
        </h2>
        <form onsubmit="addTask(event)" class="space-y-3">
          <input type="text" id="taskTitle" placeholder="ჩაწერეთ საქმე..." required
                 class="w-full px-3.5 py-2.5 rounded-xl border border-slate-700 bg-slate-900/90 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          
          <div class="grid grid-cols-2 gap-2 text-xs">
            <select id="taskCategory" class="px-2.5 py-2 rounded-lg border border-slate-700 bg-slate-900/90 text-slate-200 focus:outline-none">
              <option value="სამსახური">💼 სამსახური</option>
              <option value="ოჯახი">🏡 ოჯახი</option>
              <option value="პირადი">🎯 პირადი</option>
            </select>
            <input type="date" id="taskDate" class="px-2.5 py-2 rounded-lg border border-slate-700 bg-slate-900/90 text-slate-200 focus:outline-none">
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs">
            <select id="taskRepeat" class="px-2.5 py-2 rounded-lg border border-slate-700 bg-slate-900/90 text-slate-200 focus:outline-none">
              <option value="none">🔁 ერთჯერადი</option>
              <option value="monthly">📅 ყოველთვიური</option>
              <option value="yearly">🎆 ყოველწლიური</option>
            </select>
            <input type="time" id="taskTime" class="px-2.5 py-2 rounded-lg border border-slate-700 bg-slate-900/90 text-slate-200 focus:outline-none">
          </div>

          <button type="submit" class="w-full py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow transition flex items-center justify-center gap-1.5">
            დამატება <i class="fa-solid fa-plus"></i>
          </button>
        </form>
      </div>

      <!-- საქმეების სია და ფილტრი -->
      <div class="bg-slate-800/80 rounded-2xl p-5 shadow-sm border border-slate-700/80">
        <div class="flex items-center justify-between pb-3 border-b border-slate-700/60 mb-3">
          <h2 class="text-sm font-bold text-white">აქტიური საქმეები</h2>
          <div class="flex gap-1 text-[11px]">
            <button onclick="setFilter('ყველა')" class="cat-btn px-2 py-0.5 rounded font-bold bg-indigo-600/30 text-indigo-400 border border-indigo-500/30" data-f="ყველა">ყველა</button>
            <button onclick="setFilter('სამსახური')" class="cat-btn px-2 py-0.5 rounded text-slate-400 hover:bg-slate-700" data-f="სამსახური">სამსახური</button>
            <button onclick="setFilter('ოჯახი')" class="cat-btn px-2 py-0.5 rounded text-slate-400 hover:bg-slate-700" data-f="ოჯახი">ოჯახი</button>
            <button onclick="setFilter('პირადი')" class="cat-btn px-2 py-0.5 rounded text-slate-400 hover:bg-slate-700" data-f="პირადი">პირადი</button>
          </div>
        </div>
        <div id="taskList" class="space-y-2 max-h-[280px] overflow-y-auto custom-scroll pr-1"></div>
      </div>

      <!-- დასრულებული საქმეების არქივი + PDF ბეჭდვა -->
      <div class="bg-slate-800/80 rounded-2xl p-5 shadow-sm border border-slate-700/80">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i class="fa-solid fa-check-double text-emerald-400"></i> დასრულებული საქმეები
            </h2>
            <span id="completedCount" class="text-xs font-bold text-emerald-400 bg-emerald-950/60 border border-emerald-800/50 px-2 py-0.5 rounded-full">0</span>
          </div>
          <button onclick="openPdfModal()" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-sm transition flex items-center gap-1.5">
            <i class="fa-solid fa-file-pdf"></i> PDF ბეჭდვა
          </button>
        </div>
        <div id="completedList" class="space-y-1.5 max-h-[160px] overflow-y-auto custom-scroll pr-1 text-xs"></div>
      </div>

    </div>

    <!-- მარჯვენა სვეტი: კალენდარი, დაბადების დღეები, მიზნები, ჩვევები (7 სვეტი) -->
    <div class="lg:col-span-7 space-y-6">

      <!-- თვიური კალენდარი -->
      <div class="bg-slate-800/80 rounded-2xl p-5 shadow-sm border border-slate-700/80">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-bold text-white flex items-center gap-2">
            <i class="fa-regular fa-calendar-days text-indigo-400"></i> <span id="calendarMonthYear"></span>
          </h2>
          <div class="space-x-1">
            <button onclick="changeMonth(-1)" class="w-7 h-7 rounded border border-slate-700 text-xs hover:bg-slate-700 text-slate-300"><i class="fa-solid fa-chevron-left"></i></button>
            <button onclick="changeMonth(1)" class="w-7 h-7 rounded border border-slate-700 text-xs hover:bg-slate-700 text-slate-300"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400 mb-2">
          <div>ორშ</div><div>სამ</div><div>ოთხ</div><div>ხუთ</div><div>პარ</div><div>შაბ</div><div>კვ</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 text-xs"></div>

        <!-- არჩეული თარიღის გეგმების ჩამოშლა -->
        <div id="selectedDayContainer" class="mt-4 pt-3.5 border-t border-slate-700/60 hidden">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-xs font-bold text-indigo-300 flex items-center gap-2">
              <i class="fa-solid fa-list-check"></i> <span id="selectedDayTitle">გეგმები</span>
            </h3>
            <button onclick="closeDayDetails()" class="text-slate-400 hover:text-slate-200 text-xs">
              <i class="fa-solid fa-xmark"></i> დახურვა
            </button>
          </div>
          <div id="selectedDayTasks" class="space-y-1.5 max-h-[140px] overflow-y-auto custom-scroll pr-1 text-xs"></div>
        </div>
      </div>

      <!-- დაბადების დღეების შეხსენების ბლოკი -->
      <div class="bg-slate-800/80 rounded-2xl p-5 shadow-sm border border-slate-700/80">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1.5">
            <i class="fa-solid fa-cake-candles"></i> დაბადების დღეები (წლიური რიმაინდერი)
          </h3>
          <button onclick="addBirthdayPrompt()" class="text-[11px] text-amber-400 hover:text-amber-300 font-bold">+ დამატება</button>
        </div>
        <div id="birthdayList" class="space-y-2"></div>
      </div>

      <!-- მიზნები და ჩვევები -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- მიზნები -->
        <div class="bg-slate-800/80 rounded-2xl p-5 shadow-sm border border-slate-700/80">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i class="fa-solid fa-bullseye text-indigo-400"></i> მიზნები
            </h3>
            <button onclick="addGoalPrompt()" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-bold">+ ახალი</button>
          </div>
          <div id="goalsList" class="space-y-3"></div>
        </div>

        <!-- ყოველდღიური ჩვევები -->
        <div class="bg-slate-800/80 rounded-2xl p-5 shadow-sm border border-slate-700/80">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i class="fa-solid fa-heart-pulse text-rose-400"></i> დღის ჩვევები
            </h3>
            <button onclick="addHabitPrompt()" class="text-[11px] text-indigo-400 hover:text-indigo-300 font-bold">+ ახალი</button>
          </div>
          <div id="habitsList" class="space-y-2"></div>
        </div>

      </div>

      <!-- Backup Export/Import -->
      <div class="bg-slate-800/80 rounded-2xl p-3.5 shadow-sm border border-slate-700/80 text-xs flex justify-between items-center text-slate-400">
        <span>მონაცემთა სარეზერვო კოპია:</span>
        <div class="space-x-2">
          <button onclick="exportData()" class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded font-medium transition">გადმოწერა</button>
          <label class="px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded font-medium cursor-pointer transition">
            ატვირთვა
            <input type="file" id="importFile" class="hidden" onchange="importData(event)">
          </label>
        </div>
      </div>

    </div>
  </main>

  <!-- Edit Modal -->
  <div id="editModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-700 space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-700">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-indigo-400"></i> დავალების რედაქტირება
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form onsubmit="saveTaskEdit(event)" class="space-y-3 text-xs">
        <input type="hidden" id="editTaskId">
        <div>
          <label class="block font-medium text-slate-300 mb-1">დასახელება:</label>
          <input type="text" id="editTaskTitle" required class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-300 mb-1">კატეგორია:</label>
            <select id="editTaskCategory" class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100 focus:outline-none">
              <option value="სამსახური">💼 სამსახური</option>
              <option value="ოჯახი">🏡 ოჯახი</option>
              <option value="პირადი">🎯 პირადი</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-300 mb-1">პერიოდულობა:</label>
            <select id="editTaskRepeat" class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100 focus:outline-none">
              <option value="none">🔁 ერთჯერადი</option>
              <option value="monthly">📅 ყოველთვიური</option>
              <option value="yearly">🎆 ყოველწლიური</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-300 mb-1">თარიღი:</label>
            <input type="date" id="editTaskDate" class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100">
          </div>
          <div>
            <label class="block font-medium text-slate-300 mb-1">დრო:</label>
            <input type="time" id="editTaskTime" class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100">
          </div>
        </div>

        <div class="pt-3 flex gap-2 justify-end">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200">გაუქმება</button>
          <button type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow">შენახვა</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PDF Modal -->
  <div id="pdfModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-700 space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-700">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-file-pdf text-rose-400"></i> PDF რეპორტი თარიღებით
        </h3>
        <button onclick="closePdfModal()" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-medium text-slate-300 mb-1">საწყისი თარიღი:</label>
          <input type="date" id="pdfStartDate" class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100">
        </div>
        <div>
          <label class="block font-medium text-slate-300 mb-1">საბოლოო თარიღი:</label>
          <input type="date" id="pdfEndDate" class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100">
        </div>
        <div>
          <label class="block font-medium text-slate-300 mb-1">კატეგორია:</label>
          <select id="pdfCategory" class="w-full px-3 py-2 rounded-lg border border-slate-700 bg-slate-900 text-slate-100">
            <option value="ყველა">ყველა კატეგორია</option>
            <option value="სამსახური">💼 სამსახური</option>
            <option value="ოჯახი">🏡 ოჯახი</option>
            <option value="პირადი">🎯 პირადი</option>
          </select>
        </div>
      </div>

      <div class="pt-3 flex gap-2 justify-end">
        <button onclick="closePdfModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200">გაუქმება</button>
        <button onclick="generateCompletedPdf()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow">გენერირება</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
    let birthdays = JSON.parse(localStorage.getItem('my_birthdays')) || [];
    let habits = JSON.parse(localStorage.getItem('my_habits')) || [
      { id: 1, title: 'წყლის ბალანსი (2ლ)', done: false },
      { id: 2, title: 'ვარჯიში / აქტივობა', done: false },
      { id: 3, title: 'კითხვა / განვითარება', done: false }
    ];
    let goals = JSON.parse(localStorage.getItem('my_goals')) || [
      { id: 1, title: 'თვიური პროექტების დასრულება', progress: 40 },
      { id: 2, title: 'ოჯახური დასვენების ორგანიზება', progress: 70 }
    ];
    let currentFilter = 'ყველა';
    let calDate = new Date();
    let selectedCalendarDate = new Date().toISOString().slice(0, 10);
    let soundEnabled = localStorage.getItem('sound_enabled') === 'true';

    // Header Init
    const now = new Date();
    document.getElementById('currentDateStr').innerText = now.toLocaleDateString('ka-GE', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    document.getElementById('taskDate').value = now.toISOString().slice(0, 10);

    // Dark / Light Mode
    function applyTheme(isLight) {
      if (isLight) {
        document.documentElement.classList.remove('dark');
        document.body.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col transition-colors duration-200";
        document.getElementById('themeIcon').className = 'fa-solid fa-sun';
      } else {
        document.documentElement.classList.add('dark');
        document.body.className = "bg-slate-900 text-slate-100 min-h-screen flex flex-col transition-colors duration-200";
        document.getElementById('themeIcon').className = 'fa-solid fa-moon';
      }
    }

    function toggleDarkMode() {
      const isLight = document.documentElement.classList.contains('dark');
      applyTheme(isLight);
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }

    if (localStorage.getItem('theme') === 'light') {
      applyTheme(true);
    } else {
      applyTheme(false);
    }

    // Audio & Notifications
    function updateNotifyBtnUI() {
      const btn = document.getElementById('notifyBtn');
      const text = document.getElementById('notifyBtnText');
      if (soundEnabled) {
        btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-950/60 text-emerald-300 border border-emerald-700/60 hover:bg-emerald-900/60 transition flex items-center gap-1.5";
        text.innerText = "ხმა ჩართულია";
      } else {
        btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-900/40 text-amber-200 border border-amber-700/50 hover:bg-amber-800/40 transition flex items-center gap-1.5";
        text.innerText = "ხმა / შეხსენება";
      }
    }

    function playChime() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, t);
        osc.frequency.setValueAtTime(880.00, t + 0.15);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);

    function getBirthdayStatus(bdateStr) {
      const today = new Date();
      const parts = bdateStr.split('-');
      const month = parseInt(parts.length === 3 ? parts[1] : parts[0], 10) - 1;
      const day = parseInt(parts.length === 3 ? parts[2] : parts[1], 10);
      const birthYear = parts.length === 3 ? parseInt(parts[0], 10) : null;

      let nextBirthday = new Date(today.getFullYear(), month, day);
      if (nextBirthday < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
        nextBirthday.setFullYear(today.getFullYear() + 1);
      }

      const oneDay = 1000 * 60 * 60 * 24;
      const daysLeft = Math.round((nextBirthday - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / oneDay);
      
      let turningAge = '';
      if (birthYear && birthYear > 1900) {
        turningAge = `${nextBirthday.getFullYear() - birthYear} წლის ხდება`;
      }

      return { daysLeft, turningAge, formattedDate: `${month + 1}/${day}` };
    }

        return;
      }

      const sorted = [...birthdays].map(b => ({ ...b, status: getBirthdayStatus(b.date) }))
                                   .sort((a, b) => a.status.daysLeft - b.status.daysLeft);

      sorted.forEach(b => {
        const isToday = b.status.daysLeft === 0;
        const div = document.createElement('div');
        div.className = `flex items-center justify-between p-2.5 rounded-xl border text-xs ${
          isToday ? 'bg-amber-950/40 border-amber-600/70 text-amber-200' : 'bg-slate-900/60 border-slate-700/60 text-slate-200'

        div.innerHTML = `

            <div class="truncate">
              <span class="font-bold">${b.name}</span>

    function toggleTask(id) {
      tasks = tasks.map(t => {
        if (t.id === id) {
          // If task has recurring repeat, calculate next occurrence
          if (!t.completed && t.repeat && t.repeat !== 'none' && t.date) {
            const nextDate = new Date(t.date);
            if (t.repeat === 'monthly') {
              nextDate.setMonth(nextDate.getMonth() + 1);
            } else if (t.repeat === 'yearly') {
              nextDate.setFullYear(nextDate.getFullYear() + 1);
            }
            return {
              ...t,
              date: nextDate.toISOString().slice(0, 10),
              completed: false,
              alerted: false
            };
          }

          const isDone = !t.completed;
          return {
            ...t,
            completed: isDone,
            completedAt: isDone ? new Date().toISOString().slice(0, 10) : null
          };
        }
        return t;
      });
      saveTasks();
      renderAll();
    }

    function renderCalendar() {
      const year = calDate.getFullYear();
      const month = calDate.getMonth();
      const monthNames = ["იანვარი", "თებერვალი", "მარტი", "აპრილი", "მაისი", "ივნისი", "ივლისი", "აგვისტო", "სექტემბერი", "ოქტომბერი", "ნოემბერი", "დეკემბერი"];
      document.getElementById('calendarMonthYear').innerText = `${monthNames[month]} ${year}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
      const lastDay = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const empty = document.createElement('div');
        empty.className = 'h-14 rounded-lg bg-slate-900/20';
        grid.appendChild(empty);
      }

      const todayIso = new Date().toISOString().slice(0, 10);

      for (let day = 1; day <= lastDay; day++) {
        const curDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const curMonthDay = `${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        // Match tasks
        const dayTasks = tasks.filter(t => {
          if (!t.date) return false;
          if (t.date === curDateStr) return true;
          const tParts = t.date.split('-');
          const tDay = parseInt(tParts[2], 10);
          const tMonth = parseInt(tParts[1], 10);
          if (t.repeat === 'monthly' && tDay === day) return true;
          if (t.repeat === 'yearly' && tDay === day && tMonth === (month + 1)) return true;
          return false;
        });

        const hasBirthday = birthdays.some(b => b.date.endsWith(curMonthDay));
        const isSelected = curDateStr === selectedCalendarDate;
        const isToday = curDateStr === todayIso;

        const cell = document.createElement('div');
        cell.className = `h-14 p-1.5 rounded-xl border cursor-pointer transition flex flex-col justify-between ${
          isSelected 
            ? 'border-indigo-500 bg-indigo-950/40 ring-2 ring-indigo-500/50' 
            : (isToday ? 'border-indigo-600/70 bg-slate-900/90' : 'border-slate-700/60 bg-slate-900/50 hover:border-slate-600')
        }`;
        cell.onclick = () => selectDate(curDateStr);
        
        let dotsHtml = '';
        if (hasBirthday) {
          dotsHtml += `<span class="text-[10px]">🎂</span>`;
        }
        dayTasks.slice(0, 3).forEach(t => {
          const dotColor = t.category === 'სამსახური' ? 'bg-blue-400' : (t.category === 'ოჯახი' ? 'bg-emerald-400' : 'bg-purple-400');
          dotsHtml += `<div class="w-1.5 h-1.5 rounded-full ${dotColor}"></div>`;
        });

        cell.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold ${isToday ? 'text-indigo-400' : 'text-slate-400'}">${day}</span>
            ${dayTasks.length > 0 ? `<span class="text-[9px] text-slate-500">${dayTasks.length}</span>` : ''}
          </div>
          <div class="flex gap-1 justify-center items-center mt-auto pb-0.5">${dotsHtml}</div>
        `;
        grid.appendChild(cell);
      }
    }

    // Goals & Habits
    function addGoalPrompt() {
      const title = prompt('შეიყვანეთ ახალი მიზანი:');
      if (title) {
        goals.push({ id: Date.now(), title, progress: 10 });
        localStorage.setItem('my_goals', JSON.stringify(goals));
        renderGoals();
      }
    }

    function adjustGoal(id, delta) {
      goals = goals.map(g => g.id === id ? { ...g, progress: Math.min(100, Math.max(0, g.progress + delta)) } : g);
      localStorage.setItem('my_goals', JSON.stringify(goals));
      renderGoals();
    }

    function renderGoals() {
      const container = document.getElementById('goalsList');
      container.innerHTML = '';
      goals.forEach(g => {
        const div = document.createElement('div');
        div.className = 'space-y-1';
        div.innerHTML = `
          <div class="flex justify-between items-center text-[11px]">
            <span class="font-medium truncate text-slate-200">${g.title}</span>
            <div class="flex items-center gap-1">
              <button onclick="adjustGoal(${g.id}, -10)" class="w-4 h-4 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold">-</button>
              <span class="text-slate-400 font-semibold w-7 text-center">${g.progress}%</span>
              <button onclick="adjustGoal(${g.id}, 10)" class="w-4 h-4 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold">+</button>
            </div>
          </div>
          <div class="w-full h-1 bg-slate-700 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width: ${g.progress}%"></div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addHabitPrompt() {
      const title = prompt('შეიყვანეთ ახალი ჩვევა:');
      if (title) {
        habits.push({ id: Date.now(), title, done: false });
        localStorage.setItem('my_habits', JSON.stringify(habits));
        renderHabits();
      }
    }

    function toggleHabit(id) {
      habits = habits.map(h => h.id === id ? { ...h, done: !h.done } : h);
      localStorage.setItem('my_habits', JSON.stringify(habits));
      renderHabits();
    }

    function renderHabits() {
      const container = document.getElementById('habitsList');
      container.innerHTML = '';
      habits.forEach(h => {
        const div = document.createElement('div');
        div.className = `flex items-center justify-between p-2 rounded-xl border border-slate-700/60 cursor-pointer text-xs transition ${h.done ? 'bg-emerald-950/30 border-emerald-700/60 text-emerald-300' : 'bg-slate-900/70 text-slate-300'}`;
        div.onclick = () => toggleHabit(h.id);
        div.innerHTML = `
          <span class="${h.done ? 'font-bold' : ''}">${h.title}</span>
          <i class="${h.done ? 'fa-solid fa-circle-check text-emerald-400' : 'fa-regular fa-circle text-slate-500'}"></i>
        `;
        container.appendChild(div);
      });
    }

    // Export / Import
    function exportData() {
      const data = { tasks, birthdays, habits, goals };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `my-hub-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.tasks) tasks = imported.tasks;
          if (imported.birthdays) birthdays = imported.birthdays;
          if (imported.habits) habits = imported.habits;
          if (imported.goals) goals = imported.goals;
          saveTasks();
          localStorage.setItem('my_birthdays', JSON.stringify(birthdays));
          localStorage.setItem('my_habits', JSON.stringify(habits));
          localStorage.setItem('my_goals', JSON.stringify(goals));
          renderAll();
          alert('მონაცემები განახლდა!');
        } catch (err) {}
      };
      reader.readAsText(file);
    }

    function renderAll() {
      renderTasks();
      renderBirthdays();
      renderCalendar();
      renderGoals();
      renderHabits();
      updateNotifyBtnUI();
    }

    renderAll();
  </script>
</body>
</html>
