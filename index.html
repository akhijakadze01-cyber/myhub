<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>პერსონალური სამუშაო სივრცე</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-20 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-xl shadow-md">
        <i class="fa-solid fa-compass-drafting"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">პერსონალური სამუშაო სივრცე</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400" id="currentDateStr"></p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <button id="notifyBtn" onclick="toggleNotificationAccess()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 hover:bg-amber-200 transition flex items-center gap-1.5">
        <i class="fa-regular fa-bell"></i> <span id="notifyBtnText">ხმა / შეხსენება</span>
      </button>
      <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- მარცხენა სვეტი: Quick Task & სია (5 სვეტი) -->
    <div class="lg:col-span-5 space-y-6">
      
      <!-- Quick Task Entry -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-bolt text-amber-500"></i> სწრაფი დავალება (Quick Task)
        </h2>
        <form onsubmit="addTask(event)" class="space-y-3">
          <input type="text" id="taskTitle" placeholder="ჩაწერეთ საქმე..." required
                 class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          
          <div class="grid grid-cols-2 gap-2 text-xs">
            <select id="taskCategory" class="px-2.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
              <option value="სამსახური">💼 სამსახური</option>
              <option value="ოჯახი">🏡 ოჯახი</option>
              <option value="პირადი">🎯 პირადი / მიზნები</option>
            </select>
            <input type="date" id="taskDate" class="px-2.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
          </div>

          <div class="flex items-center gap-2">
            <input type="time" id="taskTime" class="px-2.5 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs">
            <button type="submit" class="flex-1 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs shadow transition flex items-center justify-center gap-1.5">
              დამატება <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </form>
      </div>

      <!-- საქმეების სია და ფილტრი -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700 mb-3">
          <h2 class="text-sm font-bold">აქტიური საქმეები</h2>
          <div class="flex gap-1 text-[11px]">
            <button onclick="setFilter('ყველა')" class="cat-btn px-2 py-0.5 rounded font-bold bg-indigo-50 text-indigo-600 dark:bg-indigo-950/60 dark:text-indigo-400" data-f="ყველა">ყველა</button>
            <button onclick="setFilter('სამსახური')" class="cat-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700" data-f="სამსახური">სამსახური</button>
            <button onclick="setFilter('ოჯახი')" class="cat-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700" data-f="ოჯახი">ოჯახი</button>
            <button onclick="setFilter('პირადი')" class="cat-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700" data-f="პირადი">პირადი</button>
          </div>
        </div>
        <div id="taskList" class="space-y-2 max-h-[280px] overflow-y-auto custom-scroll pr-1"></div>
      </div>

      <!-- დასრულებული საქმეების არქივი + PDF ექსპორტის ღილაკი -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i class="fa-solid fa-check-double text-emerald-500"></i> დასრულებული საქმეები
            </h2>
            <span id="completedCount" class="text-xs font-bold text-emerald-600 bg-emerald-50 dark:bg-emerald-950/40 px-2 py-0.5 rounded-full">0</span>
          </div>
          <button onclick="openPdfModal()" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition flex items-center gap-1.5">
            <i class="fa-solid fa-file-pdf"></i> PDF ბეჭდვა
          </button>
        </div>
        <div id="completedList" class="space-y-1.5 max-h-[160px] overflow-y-auto custom-scroll pr-1 text-xs"></div>
      </div>

    </div>

    <!-- მარჯვენა სვეტი: კალენდარი, მიზნები, ჩვევები (7 სვეტი) -->
    <div class="lg:col-span-7 space-y-6">

      <!-- თვიური კალენდარი -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-bold flex items-center gap-2">
            <i class="fa-regular fa-calendar-days text-indigo-500"></i> <span id="calendarMonthYear"></span>
          </h2>
          <div class="space-x-1">
            <button onclick="changeMonth(-1)" class="w-7 h-7 rounded border border-slate-200 dark:border-slate-700 text-xs hover:bg-slate-100 dark:hover:bg-slate-700"><i class="fa-solid fa-chevron-left"></i></button>
            <button onclick="changeMonth(1)" class="w-7 h-7 rounded border border-slate-200 dark:border-slate-700 text-xs hover:bg-slate-100 dark:hover:bg-slate-700"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400 mb-2">
          <div>ორშ</div><div>სამ</div><div>ოთხ</div><div>ხუთ</div><div>პარ</div><div>შაბ</div><div>კვ</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 text-xs"></div>
      </div>

      <!-- მიზნები და ჩვევები ორ სვეტად -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- მიზნები -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i class="fa-solid fa-bullseye text-indigo-500"></i> მიზნები
            </h3>
            <button onclick="addGoalPrompt()" class="text-[11px] text-indigo-600 font-bold hover:underline">+ ახალი</button>
          </div>
          <div id="goalsList" class="space-y-3"></div>
        </div>

        <!-- ყოველდღიური ჩვევები -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i class="fa-solid fa-heart-pulse text-rose-500"></i> დღის ჩვევები
            </h3>
            <button onclick="addHabitPrompt()" class="text-[11px] text-indigo-600 font-bold hover:underline">+ ახალი</button>
          </div>
          <div id="habitsList" class="space-y-2"></div>
        </div>

      </div>

      <!-- მონაცემთა მართვა (Export / Import) -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700 text-xs flex justify-between items-center text-slate-500">
        <span>მონაცემების სარეზერვო კოპია:</span>
        <div class="space-x-2">
          <button onclick="exportData()" class="px-2.5 py-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 rounded font-medium text-slate-700 dark:text-slate-200">გადმოწერა</button>
          <label class="px-2.5 py-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 rounded font-medium text-slate-700 dark:text-slate-200 cursor-pointer">
            ატვირთვა
            <input type="file" id="importFile" class="hidden" onchange="importData(event)">
          </label>
        </div>
      </div>

    </div>
  </main>

  <!-- Edit Task Modal -->
  <div id="editModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
        <h3 class="text-base font-bold flex items-center gap-2 text-slate-800 dark:text-white">
          <i class="fa-solid fa-pen-to-square text-indigo-500"></i> დავალების რედაქტირება
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form onsubmit="saveTaskEdit(event)" class="space-y-3 text-xs">
        <input type="hidden" id="editTaskId">
        <div>
          <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1">დასახელება:</label>
          <input type="text" id="editTaskTitle" required
                 class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1">კატეგორია:</label>
            <select id="editTaskCategory" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none">
              <option value="სამსახური">💼 სამსახური</option>
              <option value="ოჯახი">🏡 ოჯახი</option>
              <option value="პირადი">🎯 პირადი / მიზნები</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1">თარიღი:</label>
            <input type="date" id="editTaskDate" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1">დრო:</label>
          <input type="time" id="editTaskTime" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none">
        </div>

        <div class="pt-3 flex gap-2 justify-end">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200">
            გაუქმება
          </button>
          <button type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white flex items-center gap-1.5 shadow">
            შენახვა
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- PDF Modal -->
  <div id="pdfModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700">
        <h3 class="text-base font-bold flex items-center gap-2 text-slate-800 dark:text-white">
          <i class="fa-solid fa-file-pdf text-rose-500"></i> PDF რეპორტი თარიღებით
        </h3>
        <button onclick="closePdfModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1">საწყისი თარიღი:</label>
          <input type="date" id="pdfStartDate" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none">
        </div>
        <div>
          <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1">საბოლოო თარიღი:</label>
          <input type="date" id="pdfEndDate" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none">
        </div>
        <div>
          <label class="block font-medium text-slate-600 dark:text-slate-300 mb-1">კატეგორია:</label>
          <select id="pdfCategory" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none">
            <option value="ყველა">ყველა კატეგორია</option>
            <option value="სამსახური">💼 სამსახური</option>
            <option value="ოჯახი">🏡 ოჯახი</option>
            <option value="პირადი">🎯 პირადი / მიზნები</option>
          </select>
        </div>
      </div>

      <div class="pt-3 flex gap-2 justify-end">
        <button onclick="closePdfModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200">
          გაუქმება
        </button>
        <button onclick="generateCompletedPdf()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-print"></i> PDF გენერირება
        </button>
      </div>
    </div>
  </div>

  <script>
    // State
    let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
    let habits = JSON.parse(localStorage.getItem('my_habits')) || [
      { id: 1, title: 'წყლის ბალანსი (2ლ)', done: false },
      { id: 2, title: 'ვარჯიში / აქტივობა', done: false },
      { id: 3, title: 'კითხვა / განვითარება', done: false }
    ];
    let goals = JSON.parse(localStorage.getItem('my_goals')) || [
      { id: 1, title: 'თვიური პროექტების დასრულება', progress: 40 },
      { id: 2, title: 'ოჯახური დასვენების ორგანიზება', progress: 70 }
    ];
    let currentFilter = 'ყველა';
    let calDate = new Date();
    let soundEnabled = localStorage.getItem('sound_enabled') === 'true';

    // Init Date Header
    const now = new Date();
    document.getElementById('currentDateStr').innerText = now.toLocaleDateString('ka-GE', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
    document.getElementById('taskDate').value = now.toISOString().slice(0, 10);

    // Dark Mode
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.getElementById('themeIcon').className = 'fa-solid fa-sun';
    }

    // Audio & Notifications
    function updateNotifyBtnUI() {
      const btn = document.getElementById('notifyBtn');
      const text = document.getElementById('notifyBtnText');
      if (soundEnabled) {
        btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-100 dark:bg-emerald-900/40 text-emerald-800 dark:text-emerald-200 hover:bg-emerald-200 transition flex items-center gap-1.5";
        text.innerText = "ხმა ჩართულია";
      } else {
        btn.className = "px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 hover:bg-amber-200 transition flex items-center gap-1.5";
        text.innerText = "ხმა / შეხსენება";
      }
    }

    function playChime() {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const t = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, t);
        osc.frequency.setValueAtTime(880.00, t + 0.15);
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.8);
      } catch (e) {}
    }

    function toggleNotificationAccess() {
      soundEnabled = !soundEnabled;
      localStorage.setItem('sound_enabled', soundEnabled);
      updateNotifyBtnUI();

      if (soundEnabled) {
        playChime();
        if ('Notification' in window && Notification.permission !== 'granted') {
          Notification.requestPermission();
        }
      }
    }

    // Time Check
    setInterval(() => {
      const d = new Date();
      const currentHoursMin = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      const todayIso = d.toISOString().slice(0, 10);

      tasks.forEach(t => {
        if (!t.completed && t.time === currentHoursMin && (!t.date || t.date === todayIso) && !t.alerted) {
          t.alerted = true;
          saveTasks();
          playChime();
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`შეხსენება: ${t.category}`, {
              body: t.title,
              icon: 'https://cdn-icons-png.flaticon.com/512/906/906334.png'
            });
          }
        }
      });
    }, 15000);

    // Tasks Management
    function addTask(e) {
      e.preventDefault();
      const title = document.getElementById('taskTitle').value.trim();
      const category = document.getElementById('taskCategory').value;
      const date = document.getElementById('taskDate').value;
      const time = document.getElementById('taskTime').value;

      if (!title) return;

      tasks.unshift({
        id: Date.now(),
        title,
        category,
        date: date || new Date().toISOString().slice(0, 10),
        time: time || null,
        completed: false,
        completedAt: null,
        alerted: false
      });

      saveTasks();
      renderAll();
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskTime').value = '';
    }

    function toggleTask(id) {
      tasks = tasks.map(t => {
        if (t.id === id) {
          const isDone = !t.completed;
          return {
            ...t,
            completed: isDone,
            completedAt: isDone ? new Date().toISOString().slice(0, 10) : null
          };
        }
        return t;
      });
      saveTasks();
      renderAll();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderAll();
    }

    // Edit Modal Logic
    function openEditModal(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('editTaskId').value = task.id;
      document.getElementById('editTaskTitle').value = task.title;
      document.getElementById('editTaskCategory').value = task.category;
      document.getElementById('editTaskDate').value = task.date || '';
      document.getElementById('editTaskTime').value = task.time || '';

      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveTaskEdit(e) {
      e.preventDefault();
      const id = Number(document.getElementById('editTaskId').value);
      const title = document.getElementById('editTaskTitle').value.trim();
      const category = document.getElementById('editTaskCategory').value;
      const date = document.getElementById('editTaskDate').value;
      const time = document.getElementById('editTaskTime').value;

      if (!title) return;

      tasks = tasks.map(t => {
        if (t.id === id) {
          return {
            ...t,
            title,
            category,
            date: date || null,
            time: time || null,
            alerted: false
          };
        }
        return t;
      });

      saveTasks();
      renderAll();
      closeEditModal();
    }

    function setFilter(cat) {
      currentFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(b => {
        if (b.getAttribute('data-f') === cat) {
          b.className = 'cat-btn px-2 py-0.5 rounded font-bold bg-indigo-50 text-indigo-600 dark:bg-indigo-950/60 dark:text-indigo-400';
        } else {
          b.className = 'cat-btn px-2 py-0.5 rounded text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700';
        }
      });
      renderTasks();
    }

    function saveTasks() {
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      const activeList = document.getElementById('taskList');
      const compList = document.getElementById('completedList');
      activeList.innerHTML = '';
      compList.innerHTML = '';

      const active = tasks.filter(t => !t.completed && (currentFilter === 'ყველა' || t.category === currentFilter));
      const completed = tasks.filter(t => t.completed);

      document.getElementById('completedCount').innerText = completed.length;

      if (active.length === 0) {
        activeList.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">აქტიური საქმეები არ არის</p>`;
      } else {
        active.forEach(t => {
          const badgeClass = {
            'სამსახური': 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300',
            'ოჯახი': 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300',
            'პირადი': 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300'
          }[t.category] || 'bg-slate-100 text-slate-700';

          const div = document.createElement('div');
          div.className = 'flex items-center justify-between p-2.5 rounded-xl border border-slate-100 dark:border-slate-700/60 bg-slate-50 dark:bg-slate-900/70';
          div.innerHTML = `
            <div class="flex items-center gap-2.5 overflow-hidden">
              <input type="checkbox" onchange="toggleTask(${t.id})" class="w-4 h-4 rounded text-indigo-600 cursor-pointer">
              <div class="truncate">
                <span class="text-xs font-semibold">${t.title}</span>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="text-[9px] px-1.5 py-0.2 rounded font-bold ${badgeClass}">${t.category}</span>
                  ${t.date ? `<span class="text-[10px] text-slate-400">${t.date}</span>` : ''}
                  ${t.time ? `<span class="text-[10px] text-slate-400"><i class="fa-regular fa-clock"></i> ${t.time}</span>` : ''}
                </div>
              </div>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="openEditModal(${t.id})" class="text-slate-400 hover:text-indigo-500 text-xs p-1" title="რედაქტირება">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="deleteTask(${t.id})" class="text-slate-400 hover:text-rose-500 text-xs p-1" title="წაშლა">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          `;
          activeList.appendChild(div);
        });
      }

      if (completed.length === 0) {
        compList.innerHTML = `<p class="text-slate-400 text-center py-2">დასრულებული საქმეები ჯერ არ არის</p>`;
      } else {
        completed.slice(0, 15).forEach(t => {
          const div = document.createElement('div');
          div.className = 'flex items-center justify-between py-1.5 border-b border-slate-100 dark:border-slate-800 text-slate-400';
          div.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <i class="fa-solid fa-check text-emerald-500 text-[10px]"></i>
              <span class="line-through truncate">${t.title}</span>
              <span class="text-[10px] text-slate-500">(${t.completedAt || t.date || ''})</span>
            </div>
            <button onclick="deleteTask(${t.id})" class="hover:text-rose-500 text-[10px] ml-2"><i class="fa-solid fa-xmark"></i></button>
          `;
          compList.appendChild(div);
        });
      }
    }

    // PDF Generation
    function openPdfModal() {
      const today = new Date().toISOString().slice(0, 10);
      const firstDay = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10);
      document.getElementById('pdfStartDate').value = firstDay;
      document.getElementById('pdfEndDate').value = today;
      document.getElementById('pdfModal').classList.remove('hidden');
    }

    function closePdfModal() {
      document.getElementById('pdfModal').classList.add('hidden');
    }

    function generateCompletedPdf() {
      const startDate = document.getElementById('pdfStartDate').value;
      const endDate = document.getElementById('pdfEndDate').value;
      const selectedCat = document.getElementById('pdfCategory').value;

      const filteredCompleted = tasks.filter(t => {
        if (!t.completed) return false;
        const taskDate = t.completedAt || t.date;
        if (!taskDate) return true;
        const inDateRange = (!startDate || taskDate >= startDate) && (!endDate || taskDate <= endDate);
        const inCategory = (selectedCat === 'ყველა' || t.category === selectedCat);
        return inDateRange && inCategory;
      });

      if (filteredCompleted.length === 0) {
        alert('მითითებულ პერიოდში დასრულებული საქმეები ვერ მოიძებნა.');
        return;
      }

      closePdfModal();

      const printWindow = window.open('', '_blank');
      const tableRows = filteredCompleted.map((t, idx) => `
        <tr style="border-bottom: 1px solid #e2e8f0; font-size: 13px;">
          <td style="padding: 10px 8px; text-align: center; color: #64748b;">${idx + 1}</td>
          <td style="padding: 10px 8px; font-weight: 500;">${t.title}</td>
          <td style="padding: 10px 8px; color: #475569;">${t.category}</td>
          <td style="padding: 10px 8px; text-align: center; color: #64748b;">${t.completedAt || t.date || '-'}</td>
        </tr>
      `).join('');

      printWindow.document.write(`
        <!DOCTYPE html>
        <html lang="ka">
        <head>
          <meta charset="UTF-8">
          <title>დასრულებული საქმეების ანგარიში</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 30px; color: #1e293b; }
            .header { border-bottom: 2px solid #4f46e5; padding-bottom: 15px; margin-bottom: 25px; }
            .header h1 { margin: 0 0 6px 0; font-size: 22px; color: #0f172a; }
            .meta { font-size: 12px; color: #64748b; line-height: 1.5; }
            table { width: 100%; border-collapse: collapse; text-align: left; }
            th { background: #f8fafc; padding: 10px 8px; font-size: 12px; font-weight: 700; color: #475569; border-bottom: 2px solid #cbd5e1; }
            .footer { margin-top: 40px; font-size: 11px; text-align: right; color: #94a3b8; }
            @media print { body { padding: 0; } }
          </style>
        </head>
        <body>
          <div class="header">
            <h1>შესრულებული დავალებების ანგარიში</h1>
            <div class="meta">
              <strong>პერიოდი:</strong> ${startDate || 'დასაწყისიდან'} - ${endDate || 'დღემდე'} | 
              <strong>კატეგორია:</strong> ${selectedCat} | 
              <strong>ჯამური რაოდენობა:</strong> ${filteredCompleted.length}
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th style="width: 40px; text-align: center;">#</th>
                <th>დავალების დასახელება</th>
                <th style="width: 140px;">კატეგორია</th>
                <th style="width: 120px; text-align: center;">თარიღი</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
          <div class="footer">დაგენერირებულია პერსონალური სამუშაო სივრციდან • ${new Date().toLocaleDateString('ka-GE')}</div>
          <script>window.onload = function() { window.print(); };<\/script>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    // Calendar
    function changeMonth(delta) {
      calDate.setMonth(calDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const year = calDate.getFullYear();
      const month = calDate.getMonth();
      const monthNames = ["იანვარი", "თებერვალი", "მარტი", "აპრილი", "მაისი", "ივნისი", "ივლისი", "აგვისტო", "სექტემბერი", "ოქტომბერი", "ნოემბერი", "დეკემბერი"];
      document.getElementById('calendarMonthYear').innerText = `${monthNames[month]} ${year}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
      const lastDay = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const empty = document.createElement('div');
        empty.className = 'h-14 rounded-lg bg-slate-50/40 dark:bg-slate-900/20';
        grid.appendChild(empty);
      }

      const todayIso = new Date().toISOString().slice(0, 10);

      for (let day = 1; day <= lastDay; day++) {
        const curDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayTasks = tasks.filter(t => t.date === curDateStr);

        const cell = document.createElement('div');
        cell.className = `h-14 p-1 rounded-lg border border-slate-100 dark:border-slate-800 flex flex-col justify-between ${curDateStr === todayIso ? 'border-indigo-500 bg-indigo-50/30 dark:bg-indigo-950/20' : 'bg-slate-50/80 dark:bg-slate-900/50'}`;
        
        let dotsHtml = '';
        dayTasks.slice(0, 3).forEach(t => {
          const dotColor = t.category === 'სამსახური' ? 'bg-blue-500' : (t.category === 'ოჯახი' ? 'bg-emerald-500' : 'bg-purple-500');
          dotsHtml += `<div class="w-1.5 h-1.5 rounded-full ${dotColor}"></div>`;
        });

        cell.innerHTML = `
          <span class="text-[10px] font-bold ${curDateStr === todayIso ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-500'}">${day}</span>
          <div class="flex gap-0.5 justify-center mt-auto">${dotsHtml}</div>
        `;
        grid.appendChild(cell);
      }
    }

    // Goals & Habits
    function addGoalPrompt() {
      const title = prompt('შეიყვანეთ ახალი მიზანი:');
      if (title) {
        goals.push({ id: Date.now(), title, progress: 10 });
        localStorage.setItem('my_goals', JSON.stringify(goals));
        renderGoals();
      }
    }

    function adjustGoal(id, delta) {
      goals = goals.map(g => g.id === id ? { ...g, progress: Math.min(100, Math.max(0, g.progress + delta)) } : g);
      localStorage.setItem('my_goals', JSON.stringify(goals));
      renderGoals();
    }

    function renderGoals() {
      const container = document.getElementById('goalsList');
      container.innerHTML = '';
      goals.forEach(g => {
        const div = document.createElement('div');
        div.className = 'space-y-1';
        div.innerHTML = `
          <div class="flex justify-between items-center text-[11px]">
            <span class="font-medium truncate">${g.title}</span>
            <div class="flex items-center gap-1">
              <button onclick="adjustGoal(${g.id}, -10)" class="w-4 h-4 rounded bg-slate-100 dark:bg-slate-700 font-bold">-</button>
              <span class="text-slate-500 font-semibold w-7 text-center">${g.progress}%</span>
              <button onclick="adjustGoal(${g.id}, 10)" class="w-4 h-4 rounded bg-slate-100 dark:bg-slate-700 font-bold">+</button>
            </div>
          </div>
          <div class="w-full h-1 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 rounded-full" style="width: ${g.progress}%"></div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addHabitPrompt() {
      const title = prompt('შეიყვანეთ ახალი ჩვევა:');
      if (title) {
        habits.push({ id: Date.now(), title, done: false });
        localStorage.setItem('my_habits', JSON.stringify(habits));
        renderHabits();
      }
    }

    function toggleHabit(id) {
      habits = habits.map(h => h.id === id ? { ...h, done: !h.done } : h);
      localStorage.setItem('my_habits', JSON.stringify(habits));
      renderHabits();
    }

    function renderHabits() {
      const container = document.getElementById('habitsList');
      container.innerHTML = '';
      habits.forEach(h => {
        const div = document.createElement('div');
        div.className = `flex items-center justify-between p-2 rounded-xl border border-slate-100 dark:border-slate-700/60 cursor-pointer text-xs ${h.done ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-200' : 'bg-slate-50 dark:bg-slate-900'}`;
        div.onclick = () => toggleHabit(h.id);
        div.innerHTML = `
          <span class="${h.done ? 'text-emerald-700 dark:text-emerald-300 font-bold' : ''}">${h.title}</span>
          <i class="${h.done ? 'fa-solid fa-circle-check text-emerald-500' : 'fa-regular fa-circle text-slate-400'}"></i>
        `;
        container.appendChild(div);
      });
    }

    // Export/Import
    function exportData() {
      const data = { tasks, habits, goals };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `my-hub-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.tasks) tasks = imported.tasks;
          if (imported.habits) habits = imported.habits;
          if (imported.goals) goals = imported.goals;
          saveTasks();
          localStorage.setItem('my_habits', JSON.stringify(habits));
          localStorage.setItem('my_goals', JSON.stringify(goals));
          renderAll();
          alert('მონაცემები განახლდა!');
        } catch (err) {}
      };
      reader.readAsText(file);
    }

    function renderAll() {
      renderTasks();
      renderCalendar();
      renderGoals();
      renderHabits();
      updateNotifyBtnUI();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    renderAll();
  </script>
</body>
</html>
