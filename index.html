<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>პერსონალური სამუშაო სივრცე</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-20 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-xl shadow-md">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight">დღის მართვის ცენტრი</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400" id="currentDateStr"></p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <button id="notifyBtn" onclick="requestNotificationAccess()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 hover:bg-amber-200 transition flex items-center gap-1.5">
        <i class="fa-regular fa-bell"></i> ხმა / შეხსენება
      </button>
      <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- მარცხენა სვეტი: Quick Task & დავალებები -->
    <div class="lg:col-span-2 space-y-6">
      
      <!-- Quick Task Input -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-indigo-500"></i> ახალი საქმე
        </h2>
        <form onsubmit="addTask(event)" class="space-y-3">
          <input type="text" id="taskTitle" placeholder="რა გაქვთ გასაკეთებელი?" required
                 class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
          
          <div class="flex flex-wrap items-center gap-3">
            <select id="taskCategory" class="px-3 py-2 text-xs font-medium rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none">
              <option value="სამსახური">💼 სამსახური</option>
              <option value="ოჯახი">🏡 ოჯახი</option>
              <option value="პირადი">🎯 პირადი / მიზნები</option>
            </select>

            <input type="time" id="taskTime" class="px-3 py-2 text-xs font-medium rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none">
            
            <button type="submit" class="ml-auto px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs shadow-md transition flex items-center gap-2">
              დამატება <i class="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </form>
      </div>

      <!-- დავალებების ჩამონათვალი ფილტრებით -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700 mb-4">
          <h2 class="text-base font-bold">დაგეგმილი საქმეები</h2>
          <div class="flex gap-1 text-xs">
            <button onclick="filterTasks('ყველა')" class="filter-btn px-2.5 py-1 rounded-md bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 font-semibold" data-cat="ყველა">ყველა</button>
            <button onclick="filterTasks('სამსახური')" class="filter-btn px-2.5 py-1 rounded-md text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700" data-cat="სამსახური">💼 სამსახური</button>
            <button onclick="filterTasks('ოჯახი')" class="filter-btn px-2.5 py-1 rounded-md text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700" data-cat="ოჯახი">🏡 ოჯახი</button>
            <button onclick="filterTasks('პირადი')" class="filter-btn px-2.5 py-1 rounded-md text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700" data-cat="პირადი">🎯 პირადი</button>
          </div>
        </div>

        <div id="taskList" class="space-y-2.5 max-h-[420px] overflow-y-auto custom-scroll pr-1">
          <!-- დინამიური დავალებები -->
        </div>
      </div>

    </div>

    <!-- მარჯვენა სვეტი: ჩვევები, მიზნები და სარეზერვო კოპირება -->
    <div class="space-y-6">

      <!-- ყოველდღიური ჩვევები -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
        <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-heart-pulse text-rose-500"></i> ყოველდღიური ჩვევები
        </h3>
        <div class="space-y-3" id="habitsList">
          <!-- Habits -->
        </div>
      </div>

      <!-- მიზნები და პროგრესი -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-bullseye text-emerald-500"></i> თვიური მიზნები
          </h3>
          <button onclick="addGoalPrompt()" class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">+ მიზანი</button>
        </div>
        <div class="space-y-4" id="goalsList">
          <!-- Goals -->
        </div>
      </div>

      <!-- მონაცემთა ექსპორტი / იმპორტი -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700 text-xs flex justify-between items-center text-slate-500">
        <span>მონაცემების მართვა:</span>
        <div class="space-x-2">
          <button onclick="exportData()" class="px-2.5 py-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 rounded font-medium text-slate-700 dark:text-slate-200">გადმოწერა</button>
          <label class="px-2.5 py-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 rounded font-medium text-slate-700 dark:text-slate-200 cursor-pointer">
            ატვირთვა
            <input type="file" id="importFile" class="hidden" onchange="importData(event)">
          </label>
        </div>
      </div>

    </div>
  </main>

  <script>
    // State
    let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
    let habits = JSON.parse(localStorage.getItem('my_habits')) || [
      { id: 1, title: 'წყლის ბალანსი (2ლ)', done: false },
      { id: 2, title: 'ვარჯიში / აქტივობა', done: false },
      { id: 3, title: 'კითხვა / განვითარება', done: false }
    ];
    let goals = JSON.parse(localStorage.getItem('my_goals')) || [
      { id: 1, title: 'თვიური პროექტების დასრულება', progress: 40 },
      { id: 2, title: 'ოჯახური დასვენების ორგანიზება', progress: 70 }
    ];
    let currentFilter = 'ყველა';

    // Current Date
    const today = new Date();
    document.getElementById('currentDateStr').innerText = today.toLocaleDateString('ka-GE', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });

    // Dark Mode
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
      document.getElementById('themeIcon').className = 'fa-solid fa-sun';
    }

    // Audio Alert Synthesizer
    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880.00, now + 0.15);

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.3, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.8);
      } catch (e) {
        console.log('Audio error:', e);
      }
    }

    // Notifications
    function requestNotificationAccess() {
      if ('Notification' in window) {
        Notification.requestPermission().then(res => {
          if (res === 'granted') {
            playChime();
            new Notification('შეხსენებები გააქტიურებულია!', {
              body: 'თქვენ მიიღებთ ხმოვან შეტყობინებებს დათქმულ დროს.',
              icon: 'https://cdn-icons-png.flaticon.com/512/906/906334.png'
            });
          }
        });
      }
    }

    // Background Task Check for Time Reminder
    setInterval(() => {
      const now = new Date();
      const currentHoursMin = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      tasks.forEach(t => {
        if (!t.completed && t.time === currentHoursMin && !t.alerted) {
          t.alerted = true;
          saveTasks();
          playChime();
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`შეხსენება: ${t.category}`, {
              body: t.title,
              icon: 'https://cdn-icons-png.flaticon.com/512/906/906334.png'
            });
          }
        }
      });
    }, 15000);

    // Tasks Management
    function addTask(e) {
      e.preventDefault();
      const input = document.getElementById('taskTitle');
      const category = document.getElementById('taskCategory').value;
      const time = document.getElementById('taskTime').value;

      if (!input.value.trim()) return;

      const newTask = {
        id: Date.now(),
        title: input.value.trim(),
        category: category,
        time: time || null,
        completed: false,
        alerted: false
      };

      tasks.unshift(newTask);
      saveTasks();
      renderTasks();
      input.value = '';
      document.getElementById('taskTime').value = '';
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    function filterTasks(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = 'filter-btn px-2.5 py-1 rounded-md bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 font-semibold';
        } else {
          btn.className = 'filter-btn px-2.5 py-1 rounded-md text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700';
        }
      });
      renderTasks();
    }

    function saveTasks() {
      localStorage.setItem('my_tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';

      const filtered = tasks.filter(t => currentFilter === 'ყველა' ? true : t.category === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-xs text-slate-400 py-6">საქმეები არ არის დამატებული</p>`;
        return;
      }

      filtered.forEach(t => {
        const catBadgeColors = {
          'სამსახური': 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300',
          'ოჯახი': 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300',
          'პირადი': 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300'
        }[t.category] || 'bg-slate-100 text-slate-700';

        const div = document.createElement('div');
        div.className = `flex items-center justify-between p-3 rounded-xl border border-slate-100 dark:border-slate-700/60 transition ${t.completed ? 'bg-slate-50/70 dark:bg-slate-900/40 opacity-60' : 'bg-slate-50 dark:bg-slate-900/70 hover:border-slate-300'}`;
        div.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden">
            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})" 
                   class="w-4 h-4 rounded text-indigo-600 focus:ring-0 cursor-pointer">
            <div class="truncate">
              <span class="text-sm ${t.completed ? 'line-through text-slate-400' : 'font-medium'}">${t.title}</span>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-[10px] px-2 py-0.5 rounded-md font-semibold ${catBadgeColors}">${t.category}</span>
                ${t.time ? `<span class="text-[11px] text-slate-500 dark:text-slate-400 flex items-center gap-1"><i class="fa-regular fa-clock text-[10px]"></i> ${t.time}</span>` : ''}
              </div>
            </div>
          </div>
          <button onclick="deleteTask(${t.id})" class="text-slate-400 hover:text-rose-500 text-xs p-1.5 transition">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        container.appendChild(div);
      });
    }

    // Habits Management
    function toggleHabit(id) {
      habits = habits.map(h => h.id === id ? { ...h, done: !h.done } : h);
      localStorage.setItem('my_habits', JSON.stringify(habits));
      renderHabits();
    }

    function renderHabits() {
      const container = document.getElementById('habitsList');
      container.innerHTML = '';
      habits.forEach(h => {
        const div = document.createElement('div');
        div.className = `flex items-center justify-between p-2.5 rounded-xl border border-slate-100 dark:border-slate-700/60 cursor-pointer ${h.done ? 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-200' : 'bg-slate-50 dark:bg-slate-900'}`;
        div.onclick = () => toggleHabit(h.id);
        div.innerHTML = `
          <span class="text-xs font-medium ${h.done ? 'text-emerald-700 dark:text-emerald-300 font-semibold' : ''}">${h.title}</span>
          <i class="${h.done ? 'fa-solid fa-circle-check text-emerald-500' : 'fa-regular fa-circle text-slate-400'} text-sm"></i>
        `;
        container.appendChild(div);
      });
    }

    // Goals Management
    function addGoalPrompt() {
      const title = prompt('შეიყვანეთ ახალი მიზანი:');
      if (title) {
        goals.push({ id: Date.now(), title, progress: 10 });
        saveGoals();
        renderGoals();
      }
    }

    function adjustGoal(id, delta) {
      goals = goals.map(g => {
        if (g.id === id) {
          const updated = Math.min(100, Math.max(0, g.progress + delta));
          return { ...g, progress: updated };
        }
        return g;
      });
      saveGoals();
      renderGoals();
    }

    function saveGoals() {
      localStorage.setItem('my_goals', JSON.stringify(goals));
    }

    function renderGoals() {
      const container = document.getElementById('goalsList');
      container.innerHTML = '';
      goals.forEach(g => {
        const div = document.createElement('div');
        div.className = 'space-y-1.5';
        div.innerHTML = `
          <div class="flex justify-between items-center text-xs">
            <span class="font-medium">${g.title}</span>
            <div class="flex items-center gap-1.5">
              <button onclick="adjustGoal(${g.id}, -10)" class="w-5 h-5 rounded bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-xs font-bold">-</button>
              <span class="text-slate-500 font-semibold w-8 text-center">${g.progress}%</span>
              <button onclick="adjustGoal(${g.id}, 10)" class="w-5 h-5 rounded bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-xs font-bold">+</button>
            </div>
          </div>
          <div class="w-full h-1.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width: ${g.progress}%"></div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // Backup & Restore
    function exportData() {
      const data = { tasks, habits, goals };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `workspace-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.tasks) tasks = imported.tasks;
          if (imported.habits) habits = imported.habits;
          if (imported.goals) goals = imported.goals;
          saveTasks();
          localStorage.setItem('my_habits', JSON.stringify(habits));
          saveGoals();
          renderTasks();
          renderHabits();
          renderGoals();
          alert('მონაცემები წარმატებით განახლდა!');
        } catch (err) {
          alert('ფაილის წაკითხვა ვერ მოხერხდა.');
        }
      };
      reader.readAsText(file);
    }

    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
    }

    // Init
    renderTasks();
    renderHabits();
    renderGoals();
  </script>
</body>
</html>
